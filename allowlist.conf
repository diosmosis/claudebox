# Domains claudebox is allowed to reach. Everything else is denied.
#
# Syntax:
#
#   example.com          this host exactly
#   .example.com         the domain and every subdomain
#   *.example.com        the same thing, spelled the way people expect
#   api-*.example.com    "*" inside a label matches within that label only --
#                        it never crosses a dot
#
# The wildcard forms are expanded into what Squid can match when the proxy
# starts and on every reload; Squid's own dstdomain syntax has no wildcards and
# would take "*.example.com" as a literal hostname matching nothing. Anything
# unusable is skipped with a message rather than silently ignored -- check with
# "docker logs claudebox-proxy" if an entry seems to have no effect.
#
#   claudebox allow <domain>   add an entry and reload the proxy
#   claudebox reload           re-apply this file after editing it by hand
#   claudebox allowed          show this list
#   claudebox denied           show recently blocked requests
#
# ---------------------------------------------------------------------------
# Required for Claude Code to function
# Source: https://code.claude.com/docs/en/network-config
# ---------------------------------------------------------------------------
api.anthropic.com               # API requests, feature flags, WebFetch safety check
claude.ai                       # claude.ai account authentication
claude.com                      # sign-in redirect target
platform.claude.com             # Console auth; OAuth token exchange/refresh for both account types
downloads.claude.ai             # plugin downloads, update version checks
code.claude.com                 # documentation lookups (claude-code-guide, pre-approved WebFetch)
storage.googleapis.com          # plugin metadata and install counts shown in /plugin
raw.githubusercontent.com       # changelog feed for /release-notes
registry.npmjs.org              # npm install path -- needed for `claude update`

# ---------------------------------------------------------------------------
# Required for opencode ("claudebox opencode")
#
# Its providers are reached directly, so an Anthropic model needs only the
# entries above; another provider means adding its API host here. Plugin and
# LSP-server installs go through registry.npmjs.org and GitHub, both already
# listed further down.
# ---------------------------------------------------------------------------
opencode.ai                     # auth flow, config schema, changelog
*.opencode.ai                   # models.opencode.ai (model catalogue), api., console.
models.dev                      # the catalogue's own host, used by `opencode models --refresh`

# ---------------------------------------------------------------------------
# Local development
# ---------------------------------------------------------------------------
.ddev.site                      # DDEV project URLs, resolved to ddev-router

# ---------------------------------------------------------------------------
# Docker Hub -- image pulls for the dind sidecar
# ---------------------------------------------------------------------------
.docker.io
production.cloudflare.docker.com
production.cloudfront.docker.com  # layer blobs come from CloudFront, not Cloudflare

# ---------------------------------------------------------------------------
# Source hosting
# ---------------------------------------------------------------------------
*.github.com                    # covers github.com itself
*.githubusercontent.com
*.github.io
github-cloud.s3.amazonaws.com   # git-lfs objects: the batch API is on github.com,
                                # but the blobs themselves are handed off to S3

# ---------------------------------------------------------------------------
# Package sources
# ---------------------------------------------------------------------------
*.debian.org                    # apt
*.alpinelinux.org               # apk, for nested alpine containers
*.wordpress.org                 # covers api. and downloads. as well
*.woocommerce.com               # WooCommerce's setup wizard; hangs without it
*.packagist.org                 # composer; covers repo.packagist.org
getcomposer.org

