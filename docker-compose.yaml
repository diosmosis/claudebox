name: claudebox

services:
  claude:
    container_name: claudebox
    hostname: claudebox
    image: claudebox:latest
    build:
      context: .
      args:
        USERNAME: ${BOX_USER:-dizzy}
        UID: ${BOX_UID:-1000}
        GID: ${BOX_GID:-1000}
    init: true
    stdin_open: true
    tty: true
    command: ["sleep", "infinity"]
    working_dir: ${BOX_WORKSPACE:-/home/dizzy/Projects}
    depends_on:
      proxy:
        condition: service_healthy
      dind:
        condition: service_healthy
    environment:
      BOX_USER: ${BOX_USER:-dizzy}

      # "docker" in the box drives the sidecar daemon, never the host's.
      DOCKER_HOST: tcp://dind:2375

      # The box is on an internal network with no route off it, so these are
      # not the enforcement mechanism -- they just tell well-behaved clients
      # where the only exit is. Anything ignoring them simply fails to connect.
      HTTP_PROXY: http://proxy:3128
      HTTPS_PROXY: http://proxy:3128
      http_proxy: http://proxy:3128
      https_proxy: http://proxy:3128
      # host.docker.internal is here for the same reason it is in the list
      # entrypoint.sh injects into nested containers: it is an address on this
      # network reached directly, and sending it to Squid returns 403. Chromium
      # runs in this container and loads Matomo's tracker from that URL, so
      # without it the JS pageviews never fire and screenshots of visit data
      # come out short. Kept identical to the nested list on purpose.
      NO_PROXY: localhost,127.0.0.1,::1,host.docker.internal,dind,proxy,ddev-relay
      no_proxy: localhost,127.0.0.1,::1,host.docker.internal,dind,proxy,ddev-relay

      # Node ignores the proxy variables by default -- fetch() and the http/https
      # core clients both do -- so ordinary node code fails with EAI_AGAIN in a
      # box that has no resolver. Node 22.23 honours them, and NO_PROXY with
      # them, when this is set. Verified: without it fetch() and https.get()
      # fail; with it both work and dind is still reached directly.
      NODE_USE_ENV_PROXY: "1"

      # A DNS-preflight shim for libraries that call dns.resolve() to decide
      # whether they are online. Baked into the image, so it must exist in any
      # image built from this Dockerfile -- if this path is ever changed, the
      # image needs rebuilding or EVERY node process in the box dies on a
      # missing module.
      # --disable-warning silences only undici's "EnvHttpProxyAgent is
      # experimental" notice, which NODE_USE_ENV_PROXY prints on stderr in every
      # single node process. NODE_NO_WARNINGS would have hidden the shim's own
      # diagnostics along with it.
      NODE_OPTIONS: --disable-warning=UNDICI-EHPA --require /usr/local/lib/claudebox/proxy-bootstrap.cjs

      # The Datadog telemetry hosts are not on the allowlist; suppress the
      # requests rather than letting them fail against the proxy.
      CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"

      # What the box's opencode is told about its environment: the same notes
      # Claude Code gets as managed policy, baked in as /etc/claudebox/AGENTS.md
      # and added to every session by the config this points at.
      #
      # OPENCODE_CONFIG names an ADDITIONAL config file, not a replacement, so
      # the user's own ~/.config/opencode/opencode.json (seeded from the host by
      # entrypoint.sh) still loads. Both files must exist in the image -- a
      # missing path here is not fatal, it just silently drops the box notes.
      OPENCODE_CONFIG: /etc/claudebox/opencode.json

      # The Dockerfile owns the version (npm i -g opencode-ai). Left to itself
      # opencode would install an update into the HOME volume, which then
      # shadows the image's copy and drifts from it -- and survives a rebuild,
      # since the volume does. "claudebox rebuild" is the update path.
      OPENCODE_DISABLE_AUTOUPDATE: "1"

      # Where the `ddev` shim (baked into the image) sends `ddev exec` requests.
      # ddev-relay is in NO_PROXY above, so this goes direct, not via squid.
      CLAUDEBOX_DDEV_RELAY: http://ddev-relay:7999

      # Ports to republish from dind onto this container's loopback, so
      # "localhost:<port>" means here what it means on a single-host CI runner.
      # A container started inside dind publishes to DIND's interface, not this
      # one, so without this wp-env's WordPress is at dind:8888 and nothing that
      # expects localhost:8888 -- Puppeteer, or a screenshot baseline generated
      # on a runner -- can reach it. 8888/8889 are wp-env's development and
      # tests ports; comma-separated, empty disables.
      CLAUDEBOX_DIND_PORTS: "8888,8889"

    volumes:
      # Container-only HOME. Keeps the box's Claude state, npm cache and shell
      # history out of the host home directory.
      - box-home:/home/${BOX_USER:-dizzy}

      # The shared source tree, mounted at the same absolute path it has on the
      # host so every path Claude reports is directly clickable outside the box.
      - ${BOX_WORKSPACE:-/home/dizzy/Projects}:${BOX_WORKSPACE:-/home/dizzy/Projects}

      # Read-only so the box can see what egress is permitted without being able
      # to widen it -- the proxy reads its own copy, and only the host launcher
      # can reload it. /etc/claude-code/CLAUDE.md points here.
      - ./allowlist.conf:/etc/claudebox/allowlist.conf:ro

      # Material to consult (archives, bundles, backups), read-only. Staged
      # here from a removable drive by "claudebox media add <path>" -- the
      # drives themselves are NOT mounted through, and /media must NOT be put
      # back on Docker Desktop's file-sharing list.
      #
      # Why: this host's engine is a VM, and every shared host path is exported
      # into it by a virtiofsd process on the host that is started with the VM
      # and dies with the VM. It keeps an open fd for every inode the guest has
      # looked up, so once the box walks into /media/dizzy/<label> those fds sit
      # on the DRIVE's filesystem and umount returns EBUSY. Containers have
      # nothing to do with it: "claudebox stop" removes the box, virtiofsd keeps
      # the fds, and only quitting Docker Desktop -- stopping every container on
      # the host, DDEV included -- lets the drive be ejected. Bind flags cannot
      # help; :ro, rprivate and mounting one drive instead of /media all still
      # route through that same process.
      #
      # Staging pays a copy to make the drive ejectable at any moment. It also
      # drops the old requirement that the container be recreated for a drive
      # plugged in mid-session: this source is an ordinary directory under
      # /home, so anything added to it on the host is visible in the box at
      # once. Read-only here so the box can consult it but not alter or grow it.
      - ./media:/media:ro

      # Read-only host inputs, copied in once by entrypoint.sh.
      - ${BOX_MKCERT_CA:-/home/dizzy/.local/share/mkcert/rootCA.pem}:/host/mkcert/rootCA.pem:ro
      - ${BOX_HOST_HOME:-/home/dizzy}/.claude:/host/claude:ro
      - ${BOX_HOST_HOME:-/home/dizzy}/.claude.json:/host/claude.json:ro

    networks:
      - inner

  # The only container with a route to the internet. Everything the box and the
  # dind sidecar send outward passes through here and is checked against
  # allowlist.conf; anything not listed is refused.
  proxy:
    container_name: claudebox-proxy
    image: claudebox-proxy:latest
    build:
      context: ./proxy
    init: true
    volumes:
      - ./allowlist.conf:/etc/squid/allowlist.conf:ro
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/127.0.0.1/3128"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s
    networks:
      # inner: reachable by the box. edge: the actual egress path.
      # ddev_default: lets it resolve and reach ddev-router on the box's behalf.
      - inner
      - edge
      - ddev_default

  # A rootless Docker daemon private to the box. Claude can build and run
  # whatever it likes in here; it cannot see or touch the host's containers,
  # images or DDEV projects, and it has no route to the internet except the
  # proxy (which dockerd uses for registry pulls).
  dind:
    container_name: claudebox-dind
    image: docker:dind-rootless
    depends_on:
      proxy:
        condition: service_healthy
    # XDG_RUNTIME_DIR holds the daemon's pid files, its socket, the exec root
    # and runc's state -- all of it runtime state that is supposed to vanish
    # with the process. Nothing mounts over it here, so it lives in the
    # writable layer and survives a restart instead. A dockerd killed rather
    # than stopped (a host or daemon restart) leaves containerd.pid behind, the
    # fresh PID namespace hands that same PID to something else, and dockerd
    # refuses to start: "failed to save daemon pid to disk: process with PID
    # 171 is still running". A container that is starting has no daemon in it,
    # so everything here can only be stale. Cleared rather than made a tmpfs to
    # keep this container's mount and permission setup exactly as upstream
    # ships it. "$$" is Compose's escape for a literal "$".
    entrypoint: ["sh", "-c", "rm -rf $${XDG_RUNTIME_DIR:-/run/user/1000}/*; exec dockerd-entrypoint.sh \"$$@\"", "--"]
    # No --privileged. These four are the minimum that lets a rootless daemon
    # start nested containers: systempaths=unconfined unmasks /proc (otherwise
    # runc cannot mount procfs in the nested userns), fuse backs the overlay
    # snapshotter, and tun is needed by slirp4netns for the daemon's network.
    security_opt:
      - seccomp=unconfined
      - apparmor=unconfined
      - systempaths=unconfined
    devices:
      - /dev/fuse
      - /dev/net/tun
    environment:
      DOCKER_TLS_CERTDIR: ""
      HTTP_PROXY: http://proxy:3128
      HTTPS_PROXY: http://proxy:3128
      NO_PROXY: localhost,127.0.0.1
    # --default-address-pool keeps the networks this daemon hands out inside a
    # narrow band. On its own it is only half the fix -- see the "inner" network
    # below, which is what actually has to stay out of the way -- but it stops a
    # nested "docker compose up" from wandering across the whole 172.16/12
    # default pool and shadowing something the box needs to reach.
    command:
      - --host=tcp://0.0.0.0:2375
      - --default-address-pool=base=172.28.0.0/14,size=24
      # wp-env gives every container it starts
      # "extra_hosts: [host.docker.internal:host-gateway]", and Matomo's UI
      # tests rely on that name to reach Matomo from inside WordPress. Left
      # alone it resolves to dind's own bridge gateway, where nothing listens.
      # Point it at the ddev-http service instead, whose fixed address on
      # claudebox_inner nested containers can reach.
      - --host-gateway-ip=10.99.1.10
    volumes:
      - dind-data:/home/rootless/.local/share/docker
      # The source tree at its host path again: "-v" sources in a nested
      # "docker run" are resolved by THIS daemon, not by the box, so the paths
      # only line up if the daemon sees the tree at the same location.
      - ${BOX_WORKSPACE:-/home/dizzy/Projects}:${BOX_WORKSPACE:-/home/dizzy/Projects}
    healthcheck:
      test: ["CMD", "docker", "-H", "tcp://127.0.0.1:2375", "info"]
      interval: 3s
      timeout: 5s
      retries: 30
      start_period: 10s
    networks:
      - inner

  # The one bridge from the isolated box to the host's DDEV projects. It holds
  # the host Docker socket -- which the box itself never can -- and exposes a
  # single constrained operation over the internal network: run a command in a
  # DDEV project's service container (`ddev exec`). Its code is the trust
  # boundary; see ddev-relay/relay.mjs. On `inner` only, so it grants the box no
  # new egress: the box can send it an exec request and nothing else.
  ddev-relay:
    container_name: claudebox-ddev-relay
    image: claudebox-ddev-relay:latest
    build:
      context: ./ddev-relay
    init: true
    environment:
      CLAUDEBOX_WORKSPACE: ${BOX_WORKSPACE:-/home/dizzy/Projects}
    volumes:
      # The host Docker socket -- the relay's entire reason to exist. Only this
      # container gets it; the box does not.
      - /var/run/docker.sock:/var/run/docker.sock
      # Read-only workspace, so the relay can find each project's
      # .ddev/config.yaml and confirm a requested workdir is inside it. Builds
      # write through the web container, not this mount, so it stays read-only.
      - ${BOX_WORKSPACE:-/home/dizzy/Projects}:${BOX_WORKSPACE:-/home/dizzy/Projects}:ro
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:7999/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 3s
    networks:
      - inner

  # One fixed TCP forward, from the box to a running DDEV project's database.
  #
  # It exists because a Matomo UI-test fixture is a single PHP process that needs
  # the Matomo database AND Docker at the same time: it seeds the database
  # directly and then shells out to wp-env to start containers. The DDEV web
  # container has the database but no Docker; the box has Docker but, being on an
  # internal network, no route to the database. Nothing else closes that gap --
  # running the fixture's PHP inside DDEV via the relay cannot work, because
  # wp-env would have no daemon to start containers on.
  #
  # The alias is what makes this cheap: Matomo's config.ini.php already says
  # host = "db", which is also how the project's own web container reaches it, so
  # the identical config file works on both sides with nothing to switch.
  #
  # This grants the box no access it did not already have -- `ddev exec -s db`
  # through the relay already runs arbitrary commands in that same container.
  # What keeps it narrow is that socat has ONE hard-coded destination: it is a
  # single forward, not a general TCP proxy, and turning it into one would be a
  # hole straight through the egress allowlist. Keep the destination fixed.
  ddev-db:
    container_name: claudebox-ddev-db
    image: alpine/socat:latest
    init: true
    # "none" when the launcher found no single running project to bridge, which
    # simply never resolves. socat resolves per connection, so the service still
    # starts and starts working the moment the project comes up.
    command: >-
      tcp-listen:3306,fork,reuseaddr
      tcp-connect:ddev-${BOX_DDEV_PROJECT:-none}-db:3306
    networks:
      # inner: where the box reaches it, under the name Matomo's config expects.
      # ddev_default: where the project's database actually is.
      inner:
        aliases:
          - db
      ddev_default: {}

  # The "host.docker.internal" that containers nested inside dind expect.
  #
  # wp-env attaches "host.docker.internal:host-gateway" to everything it starts,
  # and Matomo's UI tests use that name to reach Matomo from inside WordPress --
  # on a CI runner it lands on the host, where Matomo is served. Here there is no
  # such host: Matomo is a DDEV project the box only reaches through the proxy,
  # and dind's real gateway has nothing listening on it.
  #
  # So this stands in for it. dind's --host-gateway-ip points at the fixed
  # address below, and nginx rewrites the Host header to the project's own
  # hostname, which is the only thing ddev-router routes on. Nested containers
  # can already reach this network (that is how they reach the proxy), so no new
  # path is created -- the same project, at the address CI's URLs assume.
  #
  # Like ddev-db, this is deliberately a single fixed destination. A forwarder
  # that took its target from the request would be an open relay onto
  # ddev_default, which unlike claudebox_inner has real egress.
  ddev-http:
    container_name: claudebox-ddev-http
    image: claudebox-ddev-http:latest
    build:
      context: ./ddev-http
    init: true
    environment:
      DDEV_HOST: ${BOX_DDEV_PROJECT:-none}.ddev.site
      # The project's web container directly. Not ddev-router: see the template.
      DDEV_WEB: ddev-${BOX_DDEV_PROJECT:-none}-web
    healthcheck:
      test: ["CMD", "sh", "-c", "wget -q -O /dev/null http://127.0.0.1/ 2>/dev/null || true"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 3s
    networks:
      # A fixed address, because dind's --host-gateway-ip has to name it and
      # that is set at daemon start, before Docker would assign a dynamic one.
      #
      # The alias makes the name resolve on this network too, not just inside
      # dind (where wp-env's extra_hosts provides it). The box has no resolver
      # of its own, so without this Chromium cannot load Matomo's tracker from
      # host.docker.internal -- and CI fidelity requires that exact name.
      # An alias rather than extra_hosts on the box, so the address stays
      # declared in one place.
      inner:
        ipv4_address: 10.99.1.10
        aliases:
          - host.docker.internal
      ddev_default: {}

volumes:
  box-home:
    name: claudebox-home
  dind-data:
    name: claudebox-dind-data

networks:
  # internal: true means Docker installs no default route and no NAT. Containers
  # here can talk to each other and to nothing else -- this is what makes the
  # deny-by-default real rather than a matter of client cooperation.
  inner:
    name: claudebox_inner
    internal: true
    # Pinned, and pinned OUTSIDE Docker's default address pool on purpose.
    #
    # dockerd inside the dind sidecar runs in its own network namespace and
    # allocates bridges for nested containers from the same 172.16.0.0/12 pool
    # the host daemon used for this network. Left to chance they collide: with
    # this network at 172.21.0.0/16, a nested "docker compose up" claimed
    # 172.21.0.0/16 too, and from then on the proxy's address resolved to a
    # local bridge inside dind instead of leaving via slirp4netns. Every
    # registry pull failed with "proxyconnect ... connect: connection refused"
    # while the box itself reached the same address fine.
    #
    # 10.99.1.0/24 is clear of Docker's defaults (172.16.0.0/12, then
    # 192.168.0.0/16) and of the host LAN. Changing it means checking both
    # again.
    ipam:
      config:
        - subnet: 10.99.1.0/24

  edge:
    name: claudebox_edge

  # Created by DDEV on first project start; the launcher creates it up front so
  # the box can come up before any project does. Joining it is what lets the
  # proxy reach ddev-router directly, which matters because
  # router_bind_all_interfaces is false and the host ports are loopback only.
  ddev_default:
    name: ddev_default
    external: true
