name: claudebox

services:
  claude:
    container_name: claudebox
    hostname: claudebox
    image: claudebox:latest
    build:
      context: .
      args:
        USERNAME: ${BOX_USER:-dizzy}
        UID: ${BOX_UID:-1000}
        GID: ${BOX_GID:-1000}
    init: true
    stdin_open: true
    tty: true
    command: ["sleep", "infinity"]
    # The container-side workspace path; the launcher overrides this per session
    # with the directory it was invoked from.
    working_dir: ${BOX_WORKSPACE:-/home/dizzy/Projects}
    depends_on:
      proxy:
        condition: service_healthy
      dind:
        condition: service_healthy
    environment:
      BOX_USER: ${BOX_USER:-dizzy}

      # Where the source tree is, seen from in here and from the host. Equal by
      # default; they differ when BOX_WORKSPACE_HOST points the tree at another
      # drive. entrypoint.sh reads the first to keep its ownership sweep off the
      # bind, and the box's agent reads the second to name host paths correctly
      # when they are not the paths it works with.
      CLAUDEBOX_WORKSPACE: ${BOX_WORKSPACE:-/home/dizzy/Projects}
      CLAUDEBOX_WORKSPACE_HOST: ${BOX_WORKSPACE_HOST:-${BOX_WORKSPACE:-/home/dizzy/Projects}}

      # Keep git in here from writing .git/index as a side effect.
      #
      # `git status` and `git diff` refresh the index's stat cache and save it
      # back -- and they save it by writing a temp file and renaming it over the
      # old one, so the inode changes. Mutagen reads that as a delete followed
      # by a create, not a modification. When the serving machine's git does the
      # same thing, both endpoints have "created" a file the common ancestor
      # does not have, and two-way-safe cannot resolve that in either direction.
      # The ancestor stays <non-existent>, so it never heals: the copy's index
      # freezes at the moment of the conflict while HEAD keeps moving, and
      # `git status` starts reporting staged changes that exist on neither
      # machine. sync_require_current also refuses to start the box on any
      # conflict, so this ends as a hard block, not just a wrong answer.
      #
      # A syncer rewrites mtimes constantly, which is exactly what invalidates
      # that stat cache -- so on a synced workspace this fires on essentially
      # every git command, rather than rarely.
      #
      # GIT_OPTIONAL_LOCKS=0 makes git skip any sub-operation needing a lock it
      # does not strictly need, which is precisely this write. Output is
      # unchanged -- the refresh still happens, in memory. Measured on a 9340
      # file repo with every mtime churned before every run, the worst case this
      # has: 180-198ms against 219-320ms for the default. It is FASTER, because
      # writing a 1.2MB index costs more than re-lstat'ing the entries. So this
      # is set unconditionally rather than only when attached to a sync; there
      # is no local-workspace case it costs anything.
      #
      # It does not cover deliberate index writes -- add, commit, stash,
      # checkout, rebase take non-optional locks and are unaffected. Those are a
      # genuine two-machine divergence and SHOULD conflict; box-CLAUDE.md tells
      # the agent not to run them on a synced workspace without asking.
      GIT_OPTIONAL_LOCKS: "0"

      # "docker" in the box drives the sidecar daemon, never the host's.
      DOCKER_HOST: tcp://dind:2375

      # The box is on an internal network with no route off it, so these are
      # not the enforcement mechanism -- they just tell well-behaved clients
      # where the only exit is. Anything ignoring them simply fails to connect.
      HTTP_PROXY: http://proxy:3128
      HTTPS_PROXY: http://proxy:3128
      http_proxy: http://proxy:3128
      https_proxy: http://proxy:3128
      # host.docker.internal is here for the same reason it is in the list
      # entrypoint.sh injects into nested containers: it is an address on this
      # network reached directly, and sending it to Squid returns 403. Chromium
      # runs in this container and loads Matomo's tracker from that URL, so
      # without it the JS pageviews never fire and screenshots of visit data
      # come out short. Kept identical to the nested list on purpose.
      NO_PROXY: localhost,127.0.0.1,::1,host.docker.internal,dind,proxy,ddev-relay,runner-relay
      no_proxy: localhost,127.0.0.1,::1,host.docker.internal,dind,proxy,ddev-relay,runner-relay

      # Node ignores the proxy variables by default -- fetch() and the http/https
      # core clients both do -- so ordinary node code fails with EAI_AGAIN in a
      # box that has no resolver. Node 22.23 honours them, and NO_PROXY with
      # them, when this is set. Verified: without it fetch() and https.get()
      # fail; with it both work and dind is still reached directly.
      NODE_USE_ENV_PROXY: "1"

      # A DNS-preflight shim for libraries that call dns.resolve() to decide
      # whether they are online. Baked into the image, so it must exist in any
      # image built from this Dockerfile -- if this path is ever changed, the
      # image needs rebuilding or EVERY node process in the box dies on a
      # missing module.
      # --disable-warning silences only undici's "EnvHttpProxyAgent is
      # experimental" notice, which NODE_USE_ENV_PROXY prints on stderr in every
      # single node process. NODE_NO_WARNINGS would have hidden the shim's own
      # diagnostics along with it.
      NODE_OPTIONS: --disable-warning=UNDICI-EHPA --require /usr/local/lib/claudebox/proxy-bootstrap.cjs

      # The Datadog telemetry hosts are not on the allowlist; suppress the
      # requests rather than letting them fail against the proxy.
      CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"

      # What the box's opencode is told about its environment: the same notes
      # Claude Code gets as managed policy, baked in as /etc/claudebox/AGENTS.md
      # and added to every session by the config this points at.
      #
      # OPENCODE_CONFIG names an ADDITIONAL config file, not a replacement, so
      # the user's own ~/.config/opencode/opencode.json (seeded from the host by
      # entrypoint.sh) still loads. Both files must exist in the image -- a
      # missing path here is not fatal, it just silently drops the box notes.
      OPENCODE_CONFIG: /etc/claudebox/opencode.json

      # The Dockerfile owns the version (npm i -g opencode-ai). Left to itself
      # opencode would install an update into the HOME volume, which then
      # shadows the image's copy and drifts from it -- and survives a rebuild,
      # since the volume does. "claudebox rebuild" is the update path.
      OPENCODE_DISABLE_AUTOUPDATE: "1"

      # Where the `ddev` shim (baked into the image) sends `ddev exec` requests.
      # ddev-relay is in NO_PROXY above, so this goes direct, not via squid.
      CLAUDEBOX_DDEV_RELAY: http://ddev-relay:7999

      # Where the `runner` shim (also baked in) sends sync and exec requests for
      # the remote test runner. Same arrangement: an internal-network address in
      # NO_PROXY, so it goes direct. The box never learns the runner's address,
      # token or fingerprint -- runner-relay holds all three.
      CLAUDEBOX_RUNNER_RELAY: http://runner-relay:7997

      # Ports to republish from dind onto this container's loopback, so
      # "localhost:<port>" means here what it means on a single-host CI runner.
      # A container started inside dind publishes to DIND's interface, not this
      # one, so without this wp-env's WordPress is at dind:8888 and nothing that
      # expects localhost:8888 -- Puppeteer, or a screenshot baseline generated
      # on a runner -- can reach it. 8888/8889 are wp-env's development and
      # tests ports; comma-separated, empty disables.
      CLAUDEBOX_DIND_PORTS: "8888,8889"

      # The inbound agent door's box-side half (agent-serve.mjs). Empty unless
      # BOX_AGENT_SERVE is set, and entrypoint.sh starts nothing when it is
      # empty -- a claudebox that does not send runs here grows no listener.
      CLAUDEBOX_AGENT_SERVE: ${BOX_AGENT_SERVE:-}
      CLAUDEBOX_AGENT_PORT: "7995"

    volumes:
      # Container-only HOME. Keeps the box's Claude state, npm cache and shell
      # history out of the host home directory.
      - box-home:/home/${BOX_USER:-dizzy}

      # The shared source tree. BOX_WORKSPACE_HOST defaults to BOX_WORKSPACE, so
      # by default it is mounted at the same absolute path it has on the host and
      # every path Claude reports is directly clickable outside the box. Setting
      # BOX_WORKSPACE_HOST separately keeps the tree elsewhere -- another drive --
      # while the box still sees a plain ~/Projects; the launcher then translates
      # between the two, and CLAUDEBOX_WORKSPACE_HOST above tells the box which
      # host prefix its paths correspond to.
      - ${BOX_WORKSPACE_HOST:-${BOX_WORKSPACE:-/home/dizzy/Projects}}:${BOX_WORKSPACE:-/home/dizzy/Projects}

      # Read-only so the box can see what egress is permitted without being able
      # to widen it -- the proxy reads its own copy, and only the host launcher
      # can reload it. /etc/claude-code/CLAUDE.md points here.
      - ./allowlist.conf:/etc/claudebox/allowlist.conf:ro

      # Material to consult (archives, bundles, backups), read-only. Staged
      # here from a removable drive by "claudebox media add <path>" -- the
      # drives themselves are NOT mounted through, and /media must NOT be put
      # back on Docker Desktop's file-sharing list.
      #
      # Why: this host's engine is a VM, and every shared host path is exported
      # into it by a virtiofsd process on the host that is started with the VM
      # and dies with the VM. It keeps an open fd for every inode the guest has
      # looked up, so once the box walks into /media/dizzy/<label> those fds sit
      # on the DRIVE's filesystem and umount returns EBUSY. Containers have
      # nothing to do with it: "claudebox stop" removes the box, virtiofsd keeps
      # the fds, and only quitting Docker Desktop -- stopping every container on
      # the host, DDEV included -- lets the drive be ejected. Bind flags cannot
      # help; :ro, rprivate and mounting one drive instead of /media all still
      # route through that same process.
      #
      # Staging pays a copy to make the drive ejectable at any moment. It also
      # drops the old requirement that the container be recreated for a drive
      # plugged in mid-session: this source is an ordinary directory under
      # /home, so anything added to it on the host is visible in the box at
      # once. Read-only here so the box can consult it but not alter or grow it.
      - ./media:/media:ro

      # Read-only host inputs, copied in once by entrypoint.sh.
      - ${BOX_MKCERT_CA:-/home/dizzy/.local/share/mkcert/rootCA.pem}:/host/mkcert/rootCA.pem:ro
      - ${BOX_HOST_HOME:-/home/dizzy}/.claude:/host/claude:ro
      - ${BOX_HOST_HOME:-/home/dizzy}/.claude.json:/host/claude.json:ro

    networks:
      - inner

  # The only container with a route to the internet. Everything the box and the
  # dind sidecar send outward passes through here and is checked against
  # allowlist.conf; anything not listed is refused.
  proxy:
    container_name: claudebox-proxy
    image: claudebox-proxy:latest
    build:
      context: ./proxy
    init: true
    volumes:
      - ./allowlist.conf:/etc/squid/allowlist.conf:ro
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/127.0.0.1/3128"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s
    networks:
      # inner: reachable by the box. edge: the actual egress path.
      # ddev_default: lets it resolve and reach ddev-router on the box's behalf.
      - inner
      - edge
      - ddev_default

  # A rootless Docker daemon private to the box. Claude can build and run
  # whatever it likes in here; it cannot see or touch the host's containers,
  # images or DDEV projects, and it has no route to the internet except the
  # proxy (which dockerd uses for registry pulls).
  dind:
    container_name: claudebox-dind
    image: docker:dind-rootless
    depends_on:
      proxy:
        condition: service_healthy
    # XDG_RUNTIME_DIR holds the daemon's pid files, its socket, the exec root
    # and runc's state -- all of it runtime state that is supposed to vanish
    # with the process. Nothing mounts over it here, so it lives in the
    # writable layer and survives a restart instead. A dockerd killed rather
    # than stopped (a host or daemon restart) leaves containerd.pid behind, the
    # fresh PID namespace hands that same PID to something else, and dockerd
    # refuses to start: "failed to save daemon pid to disk: process with PID
    # 171 is still running". A container that is starting has no daemon in it,
    # so everything here can only be stale. Cleared rather than made a tmpfs to
    # keep this container's mount and permission setup exactly as upstream
    # ships it. "$$" is Compose's escape for a literal "$".
    entrypoint: ["sh", "-c", "rm -rf $${XDG_RUNTIME_DIR:-/run/user/1000}/*; exec dockerd-entrypoint.sh \"$$@\"", "--"]
    # No --privileged. These four are the minimum that lets a rootless daemon
    # start nested containers: systempaths=unconfined unmasks /proc (otherwise
    # runc cannot mount procfs in the nested userns), fuse backs the overlay
    # snapshotter, and tun is needed by slirp4netns for the daemon's network.
    security_opt:
      - seccomp=unconfined
      # Not "apparmor=unconfined": Ubuntu 24.04 denies unprivileged
      # user-namespace creation to unconfined processes
      # (kernel.apparmor_restrict_unprivileged_userns=1), and rootlesskit needs
      # one before dockerd starts -- so unconfined is exactly the case that
      # fails, with "fork/exec /proc/self/exe: operation not permitted". This
      # profile is unconfined plus "userns". Install it once with
      #   sudo cp apparmor/claudebox-dind /etc/apparmor.d/ \
      #     && sudo apparmor_parser -r /etc/apparmor.d/claudebox-dind
      # See apparmor/claudebox-dind for why this rather than the host-wide
      # sysctl. On a host with no AppArmor confinement -- the Docker Desktop VM
      # this box used to run on -- the profile is absent and unconfined is
      # right: set BOX_DIND_APPARMOR=unconfined for that case.
      - apparmor=${BOX_DIND_APPARMOR:-claudebox-dind}
      - systempaths=unconfined
    # A ceiling on everything this sidecar runs -- the daemon itself, and every
    # container the box starts through it. Without one a nested container that
    # leaks (a test suite, a browser that never exits) grows until the HOST is
    # out of memory and the OOM killer picks a victim anywhere on the machine,
    # the box included. With it the kill stays inside this cgroup, which holds
    # the process that actually went wrong.
    #
    # memswap_limit is the combined memory+swap ceiling, NOT a separate swap
    # allowance: equal to mem_limit is how you say "no swap". Kept the same
    # 12g as the runner sidecar (docker-compose.runner.yaml) on purpose.
    mem_limit: 12g
    memswap_limit: 12g
    devices:
      - /dev/fuse
      - /dev/net/tun
    environment:
      DOCKER_TLS_CERTDIR: ""
      HTTP_PROXY: http://proxy:3128
      HTTPS_PROXY: http://proxy:3128
      NO_PROXY: localhost,127.0.0.1
    # --default-address-pool keeps the networks this daemon hands out inside a
    # narrow band. On its own it is only half the fix -- see the "inner" network
    # below, which is what actually has to stay out of the way -- but it stops a
    # nested "docker compose up" from wandering across the whole 172.16/12
    # default pool and shadowing something the box needs to reach.
    command:
      - --host=tcp://0.0.0.0:2375
      - --default-address-pool=base=172.28.0.0/14,size=24
      # wp-env gives every container it starts
      # "extra_hosts: [host.docker.internal:host-gateway]", and Matomo's UI
      # tests rely on that name to reach Matomo from inside WordPress. Left
      # alone it resolves to dind's own bridge gateway, where nothing listens.
      # Point it at the ddev-http service instead, whose fixed address on
      # claudebox_inner nested containers can reach.
      - --host-gateway-ip=10.99.1.10
    volumes:
      - dind-data:/home/rootless/.local/share/docker
      # The source tree again, at the path the BOX sees: "-v" sources in a nested
      # "docker run" are resolved by THIS daemon, not by the box, so the paths
      # only line up if the daemon sees the tree where the box does -- which is
      # the container-side path, not the host one, when the two differ.
      - ${BOX_WORKSPACE_HOST:-${BOX_WORKSPACE:-/home/dizzy/Projects}}:${BOX_WORKSPACE:-/home/dizzy/Projects}
    healthcheck:
      test: ["CMD", "docker", "-H", "tcp://127.0.0.1:2375", "info"]
      interval: 3s
      timeout: 5s
      retries: 30
      start_period: 10s
    networks:
      - inner

  # The one bridge from the isolated box to the host's DDEV projects. It holds
  # the host Docker socket -- which the box itself never can -- and exposes a
  # single constrained operation over the internal network: run a command in a
  # DDEV project's service container (`ddev exec`). Its code is the trust
  # boundary; see ddev-relay/relay.mjs. On `inner` only, so it grants the box no
  # new egress: the box can send it an exec request and nothing else.
  ddev-relay:
    container_name: claudebox-ddev-relay
    image: claudebox-ddev-relay:latest
    build:
      context: ./ddev-relay
    init: true
    environment:
      CLAUDEBOX_WORKSPACE: ${BOX_WORKSPACE:-/home/dizzy/Projects}
    volumes:
      # The host Docker socket -- the relay's entire reason to exist. Only this
      # container gets it; the box does not.
      - /var/run/docker.sock:/var/run/docker.sock
      # Read-only workspace, so the relay can find each project's
      # .ddev/config.yaml and confirm a requested workdir is inside it. Builds
      # write through the web container, not this mount, so it stays read-only.
      # Mounted at the path the box uses, because the workdirs it validates are
      # the ones the box sent.
      - ${BOX_WORKSPACE_HOST:-${BOX_WORKSPACE:-/home/dizzy/Projects}}:${BOX_WORKSPACE:-/home/dizzy/Projects}:ro
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:7999/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 3s
    networks:
      - inner

  # The bridge from the isolated box to a test runner on another machine.
  #
  # Same shape and the same trust model as ddev-relay: it sits on `inner` where
  # the box can reach it AND on `edge` where there is a route off this machine,
  # it holds the credential the box must not have -- the runner's address, its
  # token and the certificate fingerprint to pin -- and it forwards a fixed set
  # of routes to that one runner and nothing else.
  #
  # This is the piece that makes a remote runner possible at all without
  # dismantling the sandbox. claudebox_inner is internal: true, which means no
  # default route and no NAT, and that -- not the HTTPS_PROXY variables -- is
  # what makes egress deny-by-default. Giving the box a route to a LAN host
  # would end that; giving it one constrained operation over the internal
  # network does not.
  #
  # Unconfigured until a runner is joined ("claudebox runner add"), in which
  # case it answers every request with the join instructions rather than a
  # connection error.
  runner-relay:
    container_name: claudebox-runner-relay
    image: claudebox-runner-relay:latest
    build:
      context: ./runner-relay
    init: true
    environment:
      CLAUDEBOX_RUNNER: ${BOX_RUNNER:-}
      CLAUDEBOX_RUNNER_TOKEN: ${BOX_RUNNER_TOKEN:-}
      CLAUDEBOX_RUNNER_FINGERPRINT: ${BOX_RUNNER_FINGERPRINT:-}
    healthcheck:
      # Healthy means "listening". An unconfigured relay answers 503 with the
      # join instructions and that is a correct state to be in, not a fault --
      # the box must still come up on a machine that has no runner.
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:7997/relay-health',()=>process.exit(0)).on('error',()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 3s
    networks:
      # inner: where the box reaches it. edge: the route to the LAN, which is
      # the whole reason this container exists separately from the box.
      - inner
      - edge

  # The inbound half of the same idea: a LAN-facing front door that lets a
  # machine HOSTING a runner send a headless one-off here, instead of running an
  # agent on the one machine deliberately built without one.
  #
  # runner-relay is outbound and holds a credential for somewhere else; this is
  # inbound and holds an identity somewhere else pins. Separate from the box for
  # the same reason runner-relay is: the box gets no LAN socket, in or out. It
  # reaches the box's own listener over `inner` instead.
  #
  # Behind a profile, so it exists only where it is wanted. The launcher passes
  # --profile agent when BOX_AGENT_SERVE is set; without it this service is not
  # created and nothing listens on the LAN.
  agent-relay:
    container_name: claudebox-agent-relay
    image: claudebox-agent-relay:latest
    build:
      context: ./agent-relay
    init: true
    profiles: ["agent"]
    environment:
      CLAUDEBOX_AGENT_STATE: /var/lib/claudebox-agent
      CLAUDEBOX_AGENT_RELAY_PORT: "7996"
      # Printed in the join line by claudebox-agent-enrol, so it has to be the
      # port as seen from the OTHER machine, not the container's.
      CLAUDEBOX_AGENT_PORT: ${BOX_AGENT_PORT:-7996}
    ports:
      # The one published port on this machine. What protects it is what is in
      # front of it -- TLS with a pinned self-signed certificate, and a token
      # required on every request, both generated by agent-relay/entrypoint.sh
      # on first start.
      - "${BOX_AGENT_PORT:-7996}:7996"
    volumes:
      # The identity: token, key, certificate, enrolment window. A volume, so it
      # survives restarts and rebuilds -- delete it to rotate, and the other
      # machine has to re-join.
      - agent-state:/var/lib/claudebox-agent
    healthcheck:
      test: ["CMD", "node", "-e", "require('tls').connect({host:'127.0.0.1',port:7996,rejectUnauthorized:false},function(){process.exit(0)}).on('error',function(){process.exit(1)})"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 3s
    networks:
      # inner: where the box's listener is. edge: the route the published port
      # needs, since inner is internal: true.
      - inner
      - edge


  # The workspace door: sshd over the SAME source tree the box works in, so
  # another machine on this LAN can keep a live local copy of it and run its own
  # claudebox against that copy. "claudebox mutagen start" is what creates it.
  #
  # This sshd is only mutagen's TRANSPORT. Nothing mutagen-shaped is installed
  # in it: the other machine scp's an agent binary into this container's home
  # and talks to it over stdin/stdout, which is what "mutagen is installed on
  # neither host" comes down to. The agent lands in the login user's home, which
  # entrypoint.sh keeps on the state volume and emphatically NOT in the
  # workspace -- see the long note there.
  #
  # Why a container of its own rather than sshd in the box: everything the box
  # has is something a login shell would inherit -- a Docker client pointed at
  # dind, the proxy variables, and a place on `inner`, where the relays that
  # hold this machine's tokens live. This service has the workspace and one
  # network, and no way to reach any of that.
  #
  # `edge` alone, and that is the whole network story. A published port needs a
  # network that is not internal: true, which is the same reason agent-relay is
  # on edge -- but unlike agent-relay this one has no errand on `inner`, so it
  # is not there. An ssh session in here can see the workspace and the internet;
  # it cannot see the box, dind, the proxy or the relays.
  #
  # Behind a profile, so it exists only where it is wanted. The launcher passes
  # --profile sync when BOX_SYNC_SERVE is set; without it this service is not
  # created and nothing listens.
  sync:
    container_name: claudebox-sync
    image: claudebox-sync:latest
    build:
      context: ./sync-server
      args:
        USERNAME: ${BOX_USER:-dizzy}
        UID: ${BOX_UID:-1000}
        GID: ${BOX_GID:-1000}
    init: true
    profiles: ["sync"]
    environment:
      CLAUDEBOX_SYNC_STATE: /var/lib/claudebox-sync
      # Who sshd lets in, and which tree is served. entrypoint.sh applies both
      # at start and publishes the served path for the other machine to read
      # over ssh; see the note there on why neither is baked into the image, and
      # on why the login user's home is NOT the workspace any more.
      CLAUDEBOX_SYNC_USER: ${BOX_USER:-dizzy}
      CLAUDEBOX_WORKSPACE: ${BOX_WORKSPACE:-/home/dizzy/Projects}
    ports:
      # On the LAN, which is the point. What protects it is that there is no
      # password to guess: keys only, one user, and the list of keys is added to
      # from this machine with "claudebox mutagen authorize".
      - "${BOX_SYNC_PORT:-7994}:22"
    volumes:
      # The identity -- host key and authorized_keys. A volume, so it survives
      # restarts and rebuilds: delete it to rotate the host key, and every
      # machine that attached to this workspace has to re-pin before it can
      # attach again.
      - sync-state:/var/lib/claudebox-sync

      # The LOCAL tree, at the same container-side path the box uses. Read-write:
      # the other machine is running a claudebox over it, not reading it.
      #
      # BOX_SYNC_WORKSPACE_HOST rather than BOX_WORKSPACE_HOST, and the launcher
      # derives it: on a machine that is itself borrowing someone else's
      # workspace, BOX_WORKSPACE_HOST is the local COPY of that tree, and a door
      # that followed it would hand a third machine a workspace from somewhere
      # else -- with two independent reconcilers writing the same files. This
      # one moves only when the local workspace does.
      - ${BOX_SYNC_WORKSPACE_HOST:-${BOX_WORKSPACE_HOST:-${BOX_WORKSPACE:-/home/dizzy/Projects}}}:${BOX_WORKSPACE:-/home/dizzy/Projects}
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "22"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 2s
    networks:
      - edge
  # The syncer: a mutagen daemon and an ssh client, in a container, because
  # mutagen is not to be installed on either host.
  #
  # It is a container for a specific reason rather than tidiness. Mutagen shells
  # out to the system ssh and accepts NO per-session ssh options -- no identity
  # file, no port, no known-hosts file. All of it has to come from an ssh config
  # file, and the only one it reads is $HOME/.ssh/config for whoever it runs as.
  # On the host that is the person's own ssh config, which claudebox has no
  # business writing to. In here HOME is ours.
  #
  # `edge` ALONE, and unlike the door that is not merely tidiness: this
  # container holds an ssh private key that another machine's door trusts, and
  # `inner` is where the relays holding this machine's runner and agent tokens
  # live. It has no errand there. No proxy variables either -- mutagen speaks
  # ssh, not HTTP, and pointing it at Squid would only produce a confusing
  # failure.
  #
  # Behind a profile: the launcher passes --profile mutagen when BOX_SYNC_REMOTE
  # is set, and explicitly during "claudebox mutagen attach", which is the one
  # moment that setting does not exist yet.
  mutagen:
    container_name: claudebox-mutagen
    image: claudebox-mutagen:latest
    build:
      context: ./mutagen-client
      args:
        USERNAME: ${BOX_USER:-dizzy}
        UID: ${BOX_UID:-1000}
        GID: ${BOX_GID:-1000}
    init: true
    profiles: ["mutagen"]
    # Unlike everything else in this stack, this container going away is not
    # visible: the box keeps running over a local directory that still looks
    # exactly right and is quietly no longer being updated. require_workspace is
    # what catches that; restarting is the cheap half of the defence.
    restart: unless-stopped
    # Files mutagen writes into the copy land through a bind, so their ownership
    # is the host's ownership. Running as anything else produces a workspace the
    # box cannot write to.
    user: "${BOX_UID:-1000}:${BOX_GID:-1000}"
    environment:
      CLAUDEBOX_MUTAGEN_STATE: /var/lib/claudebox-mutagen
      CLAUDEBOX_SYNC_CLIENT_DIR: /var/lib/claudebox-sync-client
      # Where the door is. entrypoint.sh turns these three into ~/.ssh/config,
      # which is the only place mutagen will look. Changing them recreates this
      # container, which is correct -- the config is generated at start.
      CLAUDEBOX_SYNC_HOST: ${BOX_SYNC_REMOTE_HOST:-}
      CLAUDEBOX_SYNC_PORT: ${BOX_SYNC_REMOTE_PORT:-7994}
      CLAUDEBOX_SYNC_USER: ${BOX_SYNC_REMOTE_USER:-${BOX_USER:-dizzy}}
      # Only the comment on the generated key, so an authorized_keys list over
      # there says which machine each line belongs to.
      CLAUDEBOX_SYNC_LABEL: ${BOX_SYNC_LABEL:-}
      HOME: /var/lib/claudebox-mutagen/home
    volumes:
      # Daemon state, the session database, and the cache of agent binaries
      # mutagen installs on remotes. A volume: the sessions have to survive a
      # restart, or every reboot would mean a fresh full scan.
      - mutagen-state:/var/lib/claudebox-mutagen

      # This machine's ssh identity and its pinned known_hosts. A HOST bind
      # rather than a volume, because it is an identity other machines have
      # authorised: "docker volume prune" must not be a way to make every door
      # on the LAN stop letting this machine in.
      - ./sync-client:/var/lib/claudebox-sync-client

      # The local copy -- real files on this machine's disk, which is the whole
      # point of syncing rather than mounting: git runs here at local-disk
      # speed.
      #
      # Bound at the SAME path inside the container as outside, and that is
      # load-bearing rather than cosmetic. Mutagen stores the session's alpha
      # path. If the container path were a fixed /workspace, changing
      # BOX_SYNC_DIR would silently re-point a live session at a DIFFERENT host
      # tree, and mutagen would reconcile the new one against the remote --
      # which for a new empty directory means propagating the deletion of
      # everything. With the paths identical, the same change makes the session
      # unable to find its root: a failure instead of a catastrophe.
      - ${BOX_SYNC_DIR:-/home/dizzy/.claudebox/synced-workspace}:${BOX_SYNC_DIR:-/home/dizzy/.claudebox/synced-workspace}
    healthcheck:
      # That the daemon answers on its IPC socket, which is the thing that
      # matters -- a container that is "up" with a wedged daemon is exactly the
      # state that leaves the copy stale while looking fine.
      test: ["CMD-SHELL", "mutagen sync list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - edge

  # One fixed TCP forward, from the box to a running DDEV project's database.
  #
  # It exists because a Matomo UI-test fixture is a single PHP process that needs
  # the Matomo database AND Docker at the same time: it seeds the database
  # directly and then shells out to wp-env to start containers. The DDEV web
  # container has the database but no Docker; the box has Docker but, being on an
  # internal network, no route to the database. Nothing else closes that gap --
  # running the fixture's PHP inside DDEV via the relay cannot work, because
  # wp-env would have no daemon to start containers on.
  #
  # The alias is what makes this cheap: Matomo's config.ini.php already says
  # host = "db", which is also how the project's own web container reaches it, so
  # the identical config file works on both sides with nothing to switch.
  #
  # This grants the box no access it did not already have -- `ddev exec -s db`
  # through the relay already runs arbitrary commands in that same container.
  # What keeps it narrow is that socat has ONE hard-coded destination: it is a
  # single forward, not a general TCP proxy, and turning it into one would be a
  # hole straight through the egress allowlist. Keep the destination fixed.
  ddev-db:
    container_name: claudebox-ddev-db
    image: alpine/socat:latest
    init: true
    # "none" when the launcher found no single running project to bridge, which
    # simply never resolves. socat resolves per connection, so the service still
    # starts and starts working the moment the project comes up.
    command: >-
      tcp-listen:3306,fork,reuseaddr
      tcp-connect:ddev-${BOX_DDEV_PROJECT:-none}-db:3306
    networks:
      # inner: where the box reaches it, under the name Matomo's config expects.
      # ddev_default: where the project's database actually is.
      inner:
        aliases:
          - db
      ddev_default: {}

  # The "host.docker.internal" that containers nested inside dind expect.
  #
  # wp-env attaches "host.docker.internal:host-gateway" to everything it starts,
  # and Matomo's UI tests use that name to reach Matomo from inside WordPress --
  # on a CI runner it lands on the host, where Matomo is served. Here there is no
  # such host: Matomo is a DDEV project the box only reaches through the proxy,
  # and dind's real gateway has nothing listening on it.
  #
  # So this stands in for it. dind's --host-gateway-ip points at the fixed
  # address below, and nginx rewrites the Host header to the project's own
  # hostname, which is the only thing ddev-router routes on. Nested containers
  # can already reach this network (that is how they reach the proxy), so no new
  # path is created -- the same project, at the address CI's URLs assume.
  #
  # Like ddev-db, this is deliberately a single fixed destination. A forwarder
  # that took its target from the request would be an open relay onto
  # ddev_default, which unlike claudebox_inner has real egress.
  ddev-http:
    container_name: claudebox-ddev-http
    image: claudebox-ddev-http:latest
    build:
      context: ./ddev-http
    init: true
    environment:
      DDEV_HOST: ${BOX_DDEV_PROJECT:-none}.ddev.site
      # The project's web container directly. Not ddev-router: see the template.
      DDEV_WEB: ddev-${BOX_DDEV_PROJECT:-none}-web
    healthcheck:
      test: ["CMD", "sh", "-c", "wget -q -O /dev/null http://127.0.0.1/ 2>/dev/null || true"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 3s
    networks:
      # A fixed address, because dind's --host-gateway-ip has to name it and
      # that is set at daemon start, before Docker would assign a dynamic one.
      #
      # The alias makes the name resolve on this network too, not just inside
      # dind (where wp-env's extra_hosts provides it). The box has no resolver
      # of its own, so without this Chromium cannot load Matomo's tracker from
      # host.docker.internal -- and CI fidelity requires that exact name.
      # An alias rather than extra_hosts on the box, so the address stays
      # declared in one place.
      inner:
        ipv4_address: 10.99.1.10
        aliases:
          - host.docker.internal
      ddev_default: {}

volumes:
  # The agent front door's identity -- token, key, certificate. Only created
  # when the agent profile is used.
  agent-state:

  # The workspace door's identity -- host key and the list of keys allowed in.
  # Only created when the sync profile is used.
  sync-state:

  # The syncer's daemon state, session database, and cache of the agent binaries
  # it installs on remotes. Only created when the mutagen profile is used.
  mutagen-state:

  box-home:
    name: claudebox-home
  dind-data:
    name: claudebox-dind-data

networks:
  # internal: true means Docker installs no default route and no NAT. Containers
  # here can talk to each other and to nothing else -- this is what makes the
  # deny-by-default real rather than a matter of client cooperation.
  inner:
    name: claudebox_inner
    internal: true
    # Pinned, and pinned OUTSIDE Docker's default address pool on purpose.
    #
    # dockerd inside the dind sidecar runs in its own network namespace and
    # allocates bridges for nested containers from the same 172.16.0.0/12 pool
    # the host daemon used for this network. Left to chance they collide: with
    # this network at 172.21.0.0/16, a nested "docker compose up" claimed
    # 172.21.0.0/16 too, and from then on the proxy's address resolved to a
    # local bridge inside dind instead of leaving via slirp4netns. Every
    # registry pull failed with "proxyconnect ... connect: connection refused"
    # while the box itself reached the same address fine.
    #
    # 10.99.1.0/24 is clear of Docker's defaults (172.16.0.0/12, then
    # 192.168.0.0/16) and of the host LAN. Changing it means checking both
    # again.
    ipam:
      config:
        - subnet: 10.99.1.0/24

  edge:
    name: claudebox_edge

  # Created by DDEV on first project start; the launcher creates it up front so
  # the box can come up before any project does. Joining it is what lets the
  # proxy reach ddev-router directly, which matters because
  # router_bind_all_interfaces is false and the host ports are loopback only.
  ddev_default:
    name: ddev_default
    external: true
