# Installed by claudebox into a DDEV project's web container as
# /etc/apache2/sites-enabled/zz-claudebox-realip.conf. Do not edit it there --
# the container's copy is rewritten from this file. See claudebox-ddev-fixups.
#
# Matomo's UI-test tracker proxy (tests/PHPUnit/proxy/piwik.php) records the
# visitor IP from REMOTE_ADDR. On a CI runner the browser and Matomo share a
# host, so that is 127.0.0.1 -- and 127.0.0.1 is what the expected screenshots
# contain. Requests from the box arrive through claudebox's ddev-http forwarder,
# so REMOTE_ADDR is that container's address instead, and every visits-log
# screenshot differs on the IP text.
#
# ddev-http already sends the real client in X-Real-IP. mod_remoteip is the
# usual way to honour that and it does NOT work here: enabled and configured at
# both server and vhost scope, PHP still saw the peer address, because it never
# reaches the FastCGI environment. Override the variable php-fpm is handed.
#
# The regexp is what keeps this from being a spoofing hole: only a plain dotted
# quad is accepted, and only ddev-http sets the header.
#
# "zz-" so it sorts after apache-site.conf. Server scope, so it covers both the
# http and https vhosts.

ProxyFCGISetEnvIf "%{HTTP:X-Real-IP} =~ /^[0-9.]+$/" REMOTE_ADDR "%{HTTP:X-Real-IP}"
