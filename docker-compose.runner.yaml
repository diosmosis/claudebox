# claudebox-runner: the test-execution half of the box, for the machine that
# runs the tests.
#
# This file is brought up on the TARGET machine by ./claudebox-runner. Nothing
# in it is the agent, and nothing in it talks to the box directly: the box
# reaches this stack through runner-relay on its own machine, which is what
# holds the token, the pinned certificate and the route across the LAN.
#
# The stack is deliberately the same shape as the box's: a service that runs
# things, and a rootless dind sidecar it drives. What is absent is the egress
# proxy and the internal-only network -- this machine is not the one being
# sandboxed, it is the one doing the work, and a test that needs composer or
# npm needs the registries.

name: claudebox-runner

services:
  runner:
    container_name: claudebox-runner
    hostname: claudebox-runner
    image: claudebox-runner:latest
    build:
      context: ./runner
      args:
        # Built from this checkout's Dockerfile by the launcher, immediately
        # before this. See runner/Dockerfile for why it is a separate image.
        BASE_IMAGE: ${BOX_RUNNER_BASE_IMAGE:-claudebox-base:latest}
    init: true
    depends_on:
      dind:
        condition: service_healthy
    environment:
      BOX_USER: ${BOX_USER:-dizzy}
      CLAUDEBOX_RUNNER_WORKSPACE: ${BOX_RUNNER_WORKSPACE:-/home/dizzy/Projects}
      CLAUDEBOX_RUNNER_STATE: /var/lib/claudebox-runner
      # "docker" here drives the sidecar daemon, never this machine's own.
      DOCKER_HOST: tcp://dind:2375
    ports:
      # On every interface on purpose: the whole point is that the other machine
      # can reach it. What protects it is what is in front of it -- TLS with a
      # pinned self-signed certificate, and a token required on every request,
      # both generated by runner/entrypoint.sh on first start.
      - "${BOX_RUNNER_PORT:-7998}:7998"
    volumes:
      # The synced source. A named volume, not a bind: this tree is a COPY that
      # /sync maintains, and build output (node_modules, vendor, target) is
      # meant to rebuild and stay here rather than cross the network or take up
      # room on the removable drive the box's workspace lives on.
      - runner-workspace:${BOX_RUNNER_WORKSPACE:-/home/dizzy/Projects}
      # Token, key and certificate. Separate from the workspace so that wiping
      # the tree does not re-issue the runner's identity, and deleting this
      # volume is the way to rotate it.
      - runner-state:/var/lib/claudebox-runner
    healthcheck:
      # Against the real TLS listener, so this covers the certificate too. -k
      # because the certificate is self-signed and identity here is the pinned
      # fingerprint, which is the relay's job and not a health check's.
      test: ["CMD", "sh", "-c", "curl -fsk -H \"x-claudebox-runner-token: $(cat /var/lib/claudebox-runner/token)\" https://127.0.0.1:7998/health >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    networks:
      - runner

  # A rootless Docker daemon private to the runner, for the same reason the box
  # has one: tests start containers (wp-env, DDEV in later stages), and they
  # should not be starting them on this machine's own daemon.
  dind:
    container_name: claudebox-runner-dind
    image: docker:dind-rootless
    # Same reasoning as the box's sidecar: XDG_RUNTIME_DIR is runtime state
    # that lives in the writable layer and survives a restart it should not
    # have survived, and a stale containerd.pid then stops dockerd from
    # starting at all. A container that is starting has no daemon in it, so
    # anything in there can only be stale.
    entrypoint: ["sh", "-c", "rm -rf $${XDG_RUNTIME_DIR:-/run/user/1000}/*; exec dockerd-entrypoint.sh \"$$@\"", "--"]
    security_opt:
      - seccomp=unconfined
      # Ubuntu 24.04 denies unprivileged user-namespace creation to unconfined
      # processes, and rootlesskit needs one before dockerd starts -- so
      # "unconfined" is precisely the case that fails. Install the profile:
      #   sudo cp apparmor/claudebox-dind /etc/apparmor.d/
      #   sudo apparmor_parser -r /etc/apparmor.d/claudebox-dind
      # The launcher checks for this before starting and says so if it is
      # missing; see dind-apparmor.sh. On a host with no AppArmor confinement,
      # set BOX_DIND_APPARMOR=unconfined.
      - apparmor=${BOX_DIND_APPARMOR:-claudebox-dind}
      - systempaths=unconfined
    devices:
      - /dev/fuse
      - /dev/net/tun
    environment:
      DOCKER_TLS_CERTDIR: ""
    command:
      - --host=tcp://0.0.0.0:2375
      # Keep the networks this daemon hands out away from the one its own
      # containers have to reach the runner on.
      - --default-address-pool=base=172.28.0.0/14,size=24
    volumes:
      - dind-data:/home/rootless/.local/share/docker
      # The workspace at the path the RUNNER sees it, because "-v" sources in a
      # nested "docker run" are resolved by this daemon and not by the runner --
      # so a mount only lines up if this daemon sees the tree where the runner
      # does.
      - runner-workspace:${BOX_RUNNER_WORKSPACE:-/home/dizzy/Projects}
    healthcheck:
      test: ["CMD", "docker", "-H", "tcp://127.0.0.1:2375", "info"]
      interval: 3s
      timeout: 5s
      retries: 30
      start_period: 10s
    networks:
      - runner

volumes:
  runner-workspace:
    name: claudebox-runner-workspace
  runner-state:
    name: claudebox-runner-state
  dind-data:
    name: claudebox-runner-dind-data

networks:
  # An ordinary bridge, NOT internal. The box is the sandboxed machine; this one
  # has to reach package registries to build what it is asked to test.
  #
  # Pinned outside Docker's default pool for the same reason the box's inner
  # network is: dockerd inside the sidecar allocates nested bridges from
  # 172.16.0.0/12, and a collision makes the runner's own address resolve to a
  # bridge inside dind instead.
  runner:
    name: claudebox_runner
    ipam:
      config:
        - subnet: 10.99.2.0/24
