# Egress gate for claudebox: deny by default, allow only listed domains.
#
# The box sits on an internal Docker network with no route to the internet, so
# this proxy is not an advisory setting the box could ignore -- it is the only
# path out. HTTPS is tunnelled with CONNECT and never intercepted, so end-to-end
# TLS (including DDEV's mkcert certificates) is untouched.

http_port 3128

# Log every decision so "claudebox denied" can show what was blocked. Squid
# drops privileges to the "proxy" user and cannot write /dev/stdout, so these go
# to its own log directory rather than the container log. Nothing is cached --
# this is a policy gate, not a cache.
logformat claudebox %ts.%03tu %>a %Ss/%03>Hs %rm %ru
access_log stdio:/var/log/squid/access.log claudebox
cache_log /var/log/squid/cache.log
cache deny all

# Keep the pid file: "squid -k reconfigure" needs it to find the running
# process, and that is how "claudebox allow" applies a new domain without a
# restart. Setting pid_filename to none silently breaks reloads.
pid_filename /var/run/squid.pid

# Both files are GENERATED from the bind-mounted allowlist.conf by
# "allowlist build", which runs at container start and again on every reload.
# Editing them directly is pointless -- the next reload overwrites them. Edit
# allowlist.conf instead, or use "claudebox allow".
#
# Two ACLs because Squid splits the job: dstdomain covers exact hosts and
# ".domain" suffixes (which "*.domain" is rewritten to), while a "*" inside a
# label has no dstdomain equivalent and becomes an anchored regex. -i because
# hostnames are case-insensitive and dstdom_regex is not by default.
acl allowed    dstdomain    "/etc/squid/allowlist.domains"
acl allowed_re dstdom_regex -i "/etc/squid/allowlist.regex"

acl SSL_ports port 443
acl Safe_ports port 80
acl Safe_ports port 443
acl CONNECT method CONNECT

http_access deny !Safe_ports
http_access deny CONNECT !SSL_ports
http_access allow allowed
http_access allow allowed_re
http_access deny all

# The box has no resolver of its own, so every hostname is resolved here.
# (dns_v4_first was removed in Squid 5 and only logged an ERROR on startup,
# which made the reload path's parse output harder to read.)

# Don't advertise the client or the proxy to upstream hosts.
forwarded_for delete
via off
httpd_suppress_version_string on
